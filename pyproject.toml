[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph"
version = "0.5.0"
description = "Code-to-queryable-graph. A behavior-compatible successor to graphify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-graph", "call-graph", "tree-sitter", "mcp", "graphrag", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "tree-sitter>=0.23",
    "networkx>=3.2",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
langs = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-c-sharp",
    "tree-sitter-rust",
]
# Phase 2 languages (Kotlin, Swift, PHP, Scala, Lua, Bash, …) resolve their
# grammars from this bundle when a pinned tree-sitter-<lang> module is absent.
langs-extra = ["tree-sitter-language-pack>=1.0"]
embeddings = ["numpy"]
dev = ["pytest", "pytest-asyncio", "tree-sitter-language-pack>=1.0",
       "python-lsp-server"]

all = [
    "tree-sitter-language-pack>=1.0",
    "numpy",
]

[project.scripts]
codegraph = "codegraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codegraph"]

[tool.hatch.build.targets.sdist]
include = ["codegraph", "tests", "PLAN.md", "CHANGELOG.md", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
