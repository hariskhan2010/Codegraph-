[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph"
version = "0.5.0"
description = "Code-to-queryable-graph. A behavior-compatible successor to graphify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-graph", "call-graph", "tree-sitter", "mcp", "graphrag", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# `pip install codegraph` gives a working tool for all 20 languages out of the
# box. tree-sitter-language-pack bundles every Phase-2+ grammar; the 10 pinned
# grammars are preferred when present but the pack covers them too.
dependencies = [
    "tree-sitter>=0.23",
    "networkx>=3.2",
    "rapidfuzz>=3.0",
    "tree-sitter-language-pack>=1.0",
]

[project.optional-dependencies]
# pinned grammars — slightly faster/more stable than the pack for the core 10
langs = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-c-sharp",
    "tree-sitter-rust",
]
embeddings = ["numpy"]
all = ["codegraph[langs,embeddings]"]
dev = ["codegraph[langs,embeddings]", "pytest", "pytest-asyncio",
       "python-lsp-server", "build"]

[project.scripts]
codegraph = "codegraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codegraph"]
artifacts = ["codegraph/skill/SKILL.md"]

[tool.hatch.build.targets.sdist]
include = ["codegraph", "tests", "PLAN.md", "CHANGELOG.md", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
