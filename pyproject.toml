[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-graph"
version = "0.7.0"
description = "Turn a codebase into a persistent, queryable graph (SQLite + tree-sitter). A behavior-compatible successor to the graphify skill. Import and CLI are `codegraph`."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-graph", "call-graph", "tree-sitter", "mcp", "graphrag", "agent",
            "codegraph", "graphify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# `pip install codegraph` gives a working tool for all 20 languages out of the
# box. tree-sitter-language-pack bundles every Phase-2+ grammar; the 10 pinned
# grammars are preferred when present but the pack covers them too.
dependencies = [
    "tree-sitter>=0.23",
    "networkx>=3.2",
    "rapidfuzz>=3.0",
    "tree-sitter-language-pack>=1.0",
]

[project.optional-dependencies]
# pinned grammars — slightly faster/more stable than the pack for the core 10
langs = [
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-c-sharp",
    "tree-sitter-rust",
]
embeddings = ["numpy"]
media = ["faster-whisper>=1.0"]   # audio / video transcription (images need no dep)
all = ["code-graph[langs,embeddings,media]"]
dev = ["code-graph[langs,embeddings]", "pytest", "pytest-asyncio",
       "python-lsp-server", "build"]

[project.urls]
# TODO before publishing: point these at your real repo
Homepage = "https://pypi.org/project/code-graph/"
# Repository = "https://github.com/<you>/code-graph"

[project.scripts]
codegraph = "codegraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codegraph"]
artifacts = ["codegraph/skill/SKILL.md", "codegraph/skill/AGENTS_SNIPPET.md"]

[tool.hatch.build.targets.sdist]
include = ["codegraph", "tests", "PLAN.md", "CHANGELOG.md", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
