name: Release

# Push a version tag (v0.7.0) -> build standalone binaries for every OS/arch,
# build the wheel + sdist, attach everything to a GitHub Release, and (if the
# one-time setup below is done) publish to PyPI and npm.
#
# One-time setup for auto-publish:
#   * PyPI  — https://pypi.org/manage/account/publishing/  add a "trusted
#             publisher": owner `hariskhan2010`, repo `Codegraph-`,
#             workflow `release.yml`, environment left blank.  No token needed.
#   * npm   — repo Settings -> Secrets -> Actions -> add `NPM_TOKEN`
#             (an npm "Automation" access token).
# Missing setup just skips that publish step; the Release still gets every artifact.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write        # PyPI trusted publishing (OIDC)

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    asset: codegraph-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: codegraph-linux-arm64 }
          - { os: macos-13,         asset: codegraph-macos-x64 }
          - { os: macos-14,         asset: codegraph-macos-arm64 }
          - { os: windows-latest,   asset: codegraph-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip pyinstaller
          pip install ".[langs]"
      - working-directory: packaging
        run: pyinstaller --noconfirm codegraph.spec
      - name: Smoke test
        working-directory: packaging/dist
        run: ./codegraph --version || ./codegraph.exe --version
        shell: bash
      - name: Rename
        working-directory: packaging/dist
        run: |
          if [ -f codegraph.exe ]; then mv codegraph.exe "${{ matrix.asset }}";
          else mv codegraph "${{ matrix.asset }}"; fi
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/${{ matrix.asset }}

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade build && python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
